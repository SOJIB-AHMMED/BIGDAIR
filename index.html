<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mobile Webapp Home</title>
  <style>
    :root{
      --topbar:#f2b238;      /* warm amber */
      --nav:#2c2c2c;         /* dark */
      --nav2:#3a3a3a;        /* slightly lighter */
      --text:#ffffff;
      --muted:rgba(255,255,255,.75);
      --bg:#efefef;
      --card:#d8d8d8;
      --circle:#0a0a0a;
      --circleRing:rgba(255,255,255,.65);
      --divider:rgba(0,0,0,.15);
      --shadow: 0 6px 18px rgba(0,0,0,.18);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:#111; /* phone bezel feel */
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:#111;
    }

    /* App frame */
    .app{
      width: min(420px, 100vw);
      height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    /* Top amber bar */
    .topbar{
      height:64px;
      background: var(--topbar);
      display:flex;
      align-items:center;
      justify-content:flex-end;
      padding: 10px 12px;
      gap:10px;
    }
    .topbtn{
      height:44px;
      min-width:74px;
      border-radius:6px;
      background:#1f1f1f;
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:0 12px;
      box-shadow: 0 2px 0 rgba(0,0,0,.25);
      font-size:13px;
      font-weight:700;
      letter-spacing:.2px;
      user-select:none;
    }
    .topbtn svg{width:18px;height:18px;fill:var(--text)}

    /* Category strip */
    .cats{
      background: var(--nav);
      display:flex;
      align-items:stretch;
      border-bottom: 1px solid rgba(255,255,255,.08);
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
    }
    .cat{
      flex: 0 0 auto;
      width: 84px;
      padding: 10px 8px 8px;
      border-right: 1px solid rgba(255,255,255,.08);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      color:var(--muted);
      text-align:center;
      font-size:12px;
      font-weight:700;
    }
    .cat.active{
      background:#2f7f41; /* green active like the screenshot vibe */
      color:#fff;
    }
    .cat svg{width:22px;height:22px;fill:currentColor}

    /* Main content area */
    .main{
      flex:1;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.05), rgba(0,0,0,0)) 0 0/100% 120px no-repeat,
        var(--bg);
      padding: 14px 10px 86px; /* keep space for bottom nav */
      overflow:auto;
    }

    /* Big grey hero panel */
    .hero{
      background: #dcdcdc;
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px 14px 22px;
      border: 1px solid rgba(0,0,0,.10);
    }

    .circleGrid{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items:center;
      justify-items:center;
      padding: 6px 4px 12px;
    }

    .circle{
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #222, #050505 70%);
      border: 2px solid var(--circleRing);
      box-shadow: 0 10px 22px rgba(0,0,0,.25) inset;
    }

    /* Spacer bands to mimic the screenshot’s layered bands */
    .band{
      height: 58px;
      background: linear-gradient(to bottom, rgba(255,255,255,.55), rgba(255,255,255,.12));
      border-top: 1px solid var(--divider);
      border-bottom: 1px solid var(--divider);
      margin: 10px 0;
      border-radius: 6px;
    }
    .band.dark{
      background: linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,.05));
    }

    /* Bottom nav */
    .bottom{
      position: relative;
      height:74px;
      background: var(--nav);
      border-top: 1px solid rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      justify-content:space-around;
      padding: 10px 10px 8px;
    }
    .navItem{
      width: 74px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      color: var(--muted);
      font-size:12px;
      font-weight:700;
      user-select:none;
    }
    .navItem svg{width:22px;height:22px;fill:currentColor}

    /* Center floating button like screenshot */
    .fabWrap{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      top:-22px;
      width: 58px;
      height: 58px;
      border-radius:50%;
      background: #111;
      border: 3px solid rgba(255,255,255,.28);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 10px 25px rgba(0,0,0,.35);
    }
    .fabDot{
      width: 38px;
      height: 38px;
      border-radius:50%;
      background: radial-gradient(circle at 30% 30%, #222, #050505 70%);
      border: 2px solid rgba(255,255,255,.25);
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- Top bar -->
    <div class="topbar">
      <div class="topbtn" role="button" aria-label="Search">
        <svg viewBox="0 0 24 24"><path d="M10 18a8 8 0 1 1 5.293-14.01A8 8 0 0 1 10 18Zm11 3-6.1-6.1 1.4-1.4L22.4 19.6 21 21Z"/></svg>
        Search
      </div>
      <div class="topbtn" role="button" aria-label="Account">
        <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5C21 16.5 17 14 12 14Z"/></svg>
        Login / Join
      </div>
    </div>

    <!-- Categories -->
    <div class="cats" aria-label="Categories">
      <div class="cat active">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm1 5v5.4l3.6 2.1-.9 1.5L11 13V7Z"/></svg>
        Live
      </div>
      <div class="cat">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0 0 20 10 10 0 0 0 0-20Zm0 2c1.1 0 2.1.2 3 .6-.8.8-1.2 1.9-1 3l-2-.3-2 .3c.2-1.1-.2-2.2-1-3 .9-.4 1.9-.6 3-.6Zm-7.4 8c.2-1.1.7-2.1 1.3-3 .8.6 1.9.9 2.9.7l.6 1.9-1.7 1.2-3.1-.8Zm2.3 6c-.7-.9-1.1-1.9-1.3-3l1.9-1.4 1.6 1.2-.2 2.1-2 .9Zm10.2 0-2-.9-.2-2.1 1.6-1.2 1.9 1.4c-.2 1.1-.6 2.1-1.3 3Zm2.3-6-3.1.8-1.7-1.2.6-1.9c1 .2 2.1-.1 2.9-.7.6.9 1.1 1.9 1.3 3Z"/></svg>
        Football
      </div>
      <div class="cat">
        <svg viewBox="0 0 24 24"><path d="M5 20h14v2H5Zm2-3h10l2 3H5l2-3Zm.5-2L6 4h12l-1.5 11H7.5Zm2.1-9L10 13h4l.4-7H9.6Z"/></svg>
        Racing
      </div>
      <div class="cat">
        <svg viewBox="0 0 24 24"><path d="M7 2h10v4H7Zm-2 6h14v2H5Zm1 4h12l-1 10H7L6 12Zm3 2v6h2v-6Zm4 0v6h2v-6Z"/></svg>
        Cricket
      </div>
      <div class="cat">
        <svg viewBox="0 0 24 24"><path d="M12 2c5.5 0 10 4.5 10 10s-4.5 10-10 10S2 17.5 2 12 6.5 2 12 2Zm-1 4v6.2l4.5 2.6 1-1.7-3.5-2V6h-2Z"/></svg>
        Scores
      </div>
      <div class="cat">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v6H4Zm0 8h10v8H4Zm12 0h4v8h-4Z"/></svg>
        Highlights
      </div>
    </div>

    <!-- Main content -->
    <div class="main">
      <div class="hero" aria-label="Homepage panel">
        <div class="circleGrid">
          <div class="circle"></div>
          <div class="circle"></div>
          <div class="circle"></div>
          <div class="circle"></div>
          <div class="circle"></div>
          <div class="circle"></div>
          <div class="circle"></div>
          <div class="circle" style="visibility:hidden"></div>
          <div class="circle" style="visibility:hidden"></div>
        </div>

        <div class="band"></div>
        <div class="band dark"></div>
        <div class="band"></div>
      </div>
    </div>

    <!-- Bottom nav -->
    <div class="bottom" aria-label="Bottom navigation">
      <div class="navItem">
        <svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v9h6v-6h2v6h6v-9h3Z"/></svg>
        Home
      </div>

      <div class="navItem">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4Zm0 5h10v2H4Zm0 5h16v2H4Z"/></svg>
        Menu
      </div>

      <div class="fabWrap" aria-label="Center action">
        <div class="fabDot"></div>
      </div>

      <div class="navItem">
        <svg viewBox="0 0 24 24"><path d="M7 4h10v2H7Zm-2 4h14v14H5Zm2 2v10h10V10Z"/></svg>
        My List
      </div>

      <div class="navItem">
        <svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5Zm0 8L2 5v12l10 5 10-5V5Z"/></svg>
        Games
      </div>
    </div>
  </div>
</body>
</html>
